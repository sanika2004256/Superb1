  <script id="app-preloader-script">
    (function () {
      var preloader = document.getElementById('app-preloader');
      if (!preloader) return;
      var minDisplayTime = 650;
      var startTime = Date.now();
      var isDismissed = false;

      function dismiss() {
        if (isDismissed) return;
        isDismissed = true;
        var elapsed = Date.now() - startTime;
        var remaining = Math.max(0, minDisplayTime - elapsed);

        setTimeout(function () {
          preloader.classList.add('preloader-hidden');
          setTimeout(function () {
            if (preloader && preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
          }, 450);
        }, remaining);
      }

      var root = document.getElementById('root');
      if (root) {
        if (root.children.length > 0) {
          dismiss();
        } else {
          var observer = new MutationObserver(function (mutations, obs) {
            if (root.children.length > 0) {
              obs.disconnect();
              dismiss();
            }
          });
          observer.observe(root, { childList: true, subtree: true });
        }
      }

      window.addEventListener('load', function () {
        setTimeout(dismiss, 300);
      });

      setTimeout(dismiss, 3500);
    })();
  </script>

  <!-- Robust Scroll to Top -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    function forceScroll() {
      window.scrollTo(0, 0);
    }

    // Run immediately
    forceScroll();

    // Run after React mounts
    const observer = new MutationObserver((mutations) => {
      if (document.body.scrollHeight > 1000) {
        forceScroll();
        setTimeout(forceScroll, 100);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Hook into SPA navigation
    const originalPushState = history.pushState;
    history.pushState = function () {
      originalPushState.apply(this, arguments);
      forceScroll();
      setTimeout(forceScroll, 50);
      setTimeout(forceScroll, 150);
    };

    const originalReplaceState = history.replaceState;
    history.replaceState = function () {
      originalReplaceState.apply(this, arguments);
      forceScroll();
    };

    window.addEventListener('popstate', function () {
      forceScroll();
      setTimeout(forceScroll, 100);
    });
  </script>

  <script id="app-preloader-script">
    (function () {
      var preloader = document.getElementById('app-preloader');
      if (!preloader) return;

      var root = document.getElementById('root');
      if (root) {
        root.classList.add('app-loading');
      }

      var minDisplayTime = 700;
      var startTime = Date.now();
      var isDismissed = false;

      function isWebsiteReady() {
        if (!root) return false;
        var nav = root.querySelector('nav, header, [class*="min-h-screen"]');
        var textLength = root.innerText ? root.innerText.trim().length : 0;
        return !!(nav && textLength > 20);
      }

      function dismiss() {
        if (isDismissed) return;
        isDismissed = true;

        if (root) {
          root.classList.remove('app-loading');
          root.classList.add('app-revealing');
        }

        var content = preloader.querySelector('.preloader-content');
        if (content) {
          content.style.opacity = '0';
          content.style.transform = 'scale(0.96)';
        }

        // Show the blur screen over the website
        preloader.classList.add('preloader-blur-stage');

        setTimeout(function () {
          preloader.classList.add('preloader-hidden');
          if (root) {
            root.classList.remove('app-revealing');
            root.classList.add('app-ready');
          }

          setTimeout(function () {
            if (preloader && preloader.parentNode) {
              preloader.parentNode.removeChild(preloader);
            }
          }, 550);
        }, 320);
      }

      function checkAndTrigger() {
        if (isDismissed) return;
        if (isWebsiteReady()) {
          var elapsed = Date.now() - startTime;
          var remaining = Math.max(0, minDisplayTime - elapsed);
          setTimeout(dismiss, remaining);
          return true;
        }
        return false;
      }

      if (root) {
        var observer = new MutationObserver(function () {
          if (checkAndTrigger()) {
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true, subtree: true });
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          checkAndTrigger();
        }, 200);
      });

      var pollInterval = setInterval(function () {
        if (isDismissed) {
          clearInterval(pollInterval);
          return;
        }
        if (checkAndTrigger()) {
          clearInterval(pollInterval);
        }
      }, 100);

      setTimeout(function () {
        clearInterval(pollInterval);
        dismiss();
      }, 4000);
    })();
  </script>

  <!-- Robust Scroll to Top -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    function forceScroll() {
      window.scrollTo(0, 0);
    }

    // Run immediately
    forceScroll();

    // Run after React mounts
    const observer = new MutationObserver((mutations) => {
      if (document.body.scrollHeight > 1000) {
        forceScroll();
        setTimeout(forceScroll, 100);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Hook into SPA navigation
    const originalPushState = history.pushState;
    history.pushState = function () {
      originalPushState.apply(this, arguments);
      forceScroll();
      setTimeout(forceScroll, 50);
      setTimeout(forceScroll, 150);
    };

    const originalReplaceState = history.replaceState;
    history.replaceState = function () {
      originalReplaceState.apply(this, arguments);
      forceScroll();
    };

    window.addEventListener('popstate', function () {
      forceScroll();
      setTimeout(forceScroll, 100);
    });
  </script>
